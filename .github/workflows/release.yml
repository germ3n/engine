name: Compile & Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA, branch, or tag to build (leave blank for latest default branch commit)'
        required: false
        type: string
      release_tag:
        description: 'Custom release tag (e.g. v1.0.0). Defaults to build-<short-sha>'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: base
            asset_name: base-linux-x86_64
            editor_binary: editor
            editor_asset: editor-linux-x86_64
            rustflags: -C target-cpu=x86-64-v3
          - os: ubuntu-24.04-arm
            binary_name: base
            asset_name: base-linux-arm64
            editor_binary: editor
            editor_asset: editor-linux-arm64
            rustflags: -C target-cpu=generic
          - os: windows-latest
            binary_name: base.exe
            asset_name: base-windows-x86_64.exe
            editor_binary: editor.exe
            editor_asset: editor-windows-x86_64.exe
            rustflags: -C target-cpu=x86-64-v3
          - os: macos-latest
            binary_name: base
            asset_name: base-macos-arm64
            editor_binary: editor
            editor_asset: editor-macos-arm64
            rustflags: -C target-cpu=apple-m1
          - os: windows-11-arm
            binary_name: base.exe
            asset_name: base-windows-arm64.exe
            editor_binary: editor.exe
            editor_asset: editor-windows-arm64.exe
            rustflags: -C target-cpu=generic
          - os: ubuntu-latest
            kind: android
            asset_name: base-android-arm64.apk
          # TODO: Add iOS build
          #- os: macos-latest
          #  kind: ios
          #  asset_name: base-ios-arm64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Download Qwen model
        if: matrix.kind != 'android' && matrix.kind != 'ios'
        shell: bash
        run: |
          mkdir -p models
          curl -L --fail -o models/qwen.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.asset_name }}

      - name: Configure Windows ARM MSVC
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          echo "VSCMD_ARG_HOST_ARCH=arm64" >> "$GITHUB_ENV"
          echo "VSCMD_ARG_TGT_ARCH=arm64" >> "$GITHUB_ENV"

      - name: Install Linux gamepad libraries
        if: runner.os == 'Linux' && matrix.kind != 'android'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Setup Java
        if: matrix.kind == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        if: matrix.kind == 'android'
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          NDK="$(ls -d "$SDK/ndk"/* | sort -V | tail -1)"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Setup Gradle
        if: matrix.kind == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release Binaries
        if: matrix.kind != 'android' && matrix.kind != 'ios'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test && cargo build --release --bin base --bin editor

      - name: Build Android
        if: matrix.kind == 'android'
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-u,ANativeActivity_onCreate
        run: sh mobile/android/build.sh

      - name: Build iOS
        if: matrix.kind == 'ios'
        run: sh mobile/ios/build.sh

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="build-${SHORT_SHA}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Prepare Asset
        if: matrix.kind != 'android' && matrix.kind != 'ios'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          cp target/release/${{ matrix.editor_binary }} dist/${{ matrix.editor_asset }}
          if [ "${{ matrix.asset_name }}" = "base-linux-x86_64" ]; then
            if [ -f target/release/base.pak ]; then
              cp target/release/base.pak dist/base.pak
            elif [ -f target/release/game/base.pak ]; then
              cp target/release/game/base.pak dist/base.pak
            elif [ -f game/base/base.pak ]; then
              cp game/base/base.pak dist/base.pak
            else
              echo "base.pak was not produced by the build"
              exit 1
            fi
            echo "Prepared base.pak"
          fi

      - name: Prepare Android Asset
        if: matrix.kind == 'android'
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/${{ matrix.asset_name }}

      - name: Prepare iOS Asset
        if: matrix.kind == 'ios'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent mobile/ios/build/Engine.app "dist/${{ matrix.asset_name }}"

      - name: Upload Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Copyright Notices
        if: matrix.asset_name == 'base-linux-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: THIRD_PARTY_NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Wiki Asset
        if: matrix.asset_name == 'base-linux-x86_64'
        shell: bash
        run: |
          if [ ! -f target/wiki/index.html ]; then
            echo "wiki was not produced by the build"
            exit 1
          fi
          cp target/wiki/index.html wiki.html

      - name: Upload Wiki
        if: matrix.asset_name == 'base-linux-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: wiki.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-bsd:
    name: Build (${{ matrix.asset_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: freebsd
            binary_name: base
            asset_name: base-freebsd-x86_64
            editor_binary: editor
            editor_asset: editor-freebsd-x86_64
            rustflags: -C target-cpu=x86-64-v3
          #- kind: dragonfly
          #  binary_name: base
          #  asset_name: base-dragonfly-x86_64
          #  editor_binary: editor
          #  editor_asset: editor-dragonfly-x86_64
          #  rustflags: -C target-cpu=x86-64-v3

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Download Qwen model
        if: matrix.kind != 'android' && matrix.kind != 'ios'
        shell: bash
        run: |
          mkdir -p models
          curl -L --fail -o models/qwen.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: Build in FreeBSD
        if: matrix.kind == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: true
          mem: '8192'
          cpu: '2'
          envs: RUSTFLAGS
          prepare: |
            set -eu
            pkg install -y curl ca_root_nss pkgconf gmake libudev-devd
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            . "$HOME/.cargo/env"
            export CC=cc
            export HOST_CC=cc
            export CARGO_BUILD_JOBS=1
            udev_pc=$(find /usr/local /usr -name 'libudev.pc' 2>/dev/null | head -n 1)
            if [ -z "$udev_pc" ]; then
              echo "libudev.pc was not installed"
              pkg info -l libudev-devd || true
              exit 1
            fi
            export PKG_CONFIG_PATH="$(dirname "$udev_pc")"
            cargo test
            echo "cargo test finished"
            cargo build --release --bin base --bin editor
            echo "cargo build finished"

      - name: Build in DragonFly
        if: matrix.kind == 'dragonfly'
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          copyback: true
          mem: '8192'
          cpu: '2'
          envs: RUSTFLAGS
          prepare: |
            set -eu
            pkg install -y rust pkgconf gmake libudev-devd
          run: |
            set -eu
            export CC=cc
            export HOST_CC=cc
            export CARGO_BUILD_JOBS=1
            udev_pc=$(find /usr/local /usr -name 'libudev.pc' 2>/dev/null | head -n 1)
            if [ -z "$udev_pc" ]; then
              echo "libudev.pc was not installed"
              pkg info -l libudev-devd || true
              exit 1
            fi
            export PKG_CONFIG_PATH="$(dirname "$udev_pc")"
            cargo test --ignore-rust-version
            echo "cargo test finished"
            cargo build --release --bin base --bin editor --ignore-rust-version
            echo "cargo build finished"

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="build-${SHORT_SHA}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Prepare Asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          cp target/release/${{ matrix.editor_binary }} dist/${{ matrix.editor_asset }}

      - name: Upload Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}