plugins {
    id "com.android.application"
}

android {
    namespace "com.engine.base"
    compileSdk 34

    defaultConfig {
        applicationId "com.engine.base"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}
